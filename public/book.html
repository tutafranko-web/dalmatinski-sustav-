<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e4d43">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>Rezervacija</title>
<link rel="stylesheet" href="/static/opsis.css">
<style>
  body { background: var(--kamen); }
  .wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; background: var(--kamen); }
  header.band { background: var(--lamele); color: #fff; padding: 14px 20px 20px; }
  .langs { display: flex; justify-content: flex-end; gap: 2px; margin-bottom: 6px; }
  .langs button { border: 0; background: none; color: rgba(255, 255, 255, .75); font: 700 13px var(--body); padding: 6px 8px; border-radius: 6px; cursor: pointer; letter-spacing: .04em; }
  .langs button.on { color: #fff; background: rgba(255, 255, 255, .14); }
  header h1 { font-size: 32px; }
  .addr { margin-top: 4px; font-size: 14px; opacity: .88; }
  .hrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .hbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .08); color: #fff;
    font: 600 14px var(--body); padding: 7px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; }
  .hbtn:hover { background: rgba(255, 255, 255, .16); }
  .hbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: #8fd19e; }
  .hbtn .dot.off { background: #f1a79f; }

  main { padding: 18px 16px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  main > *, #pick > *, #mView > * { min-width: 0; }
  .sec { background: var(--vapno); border: 1px solid var(--crta); border-radius: 14px; padding: 16px; }
  .sec h2 { font-size: 19px; margin-bottom: 12px; display: flex; align-items: baseline; gap: 8px; }
  .sec h2 small { font: 500 13px var(--body); color: var(--sivo); }

  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--crta); background: #fff; font: 600 24px/1 var(--body); color: var(--skura); cursor: pointer; }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper output { font: 700 34px var(--mono); min-width: 52px; text-align: center; }
  .stepper .lbl { color: var(--sivo); }
  .bignote { margin-top: 10px; font-size: 14px; color: var(--sivo); }

  .days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scroll-snap-type: x proximity; scrollbar-width: thin; }
  .day { flex: 0 0 auto; width: 70px; padding: 8px 4px 9px; border: 1px solid var(--crta); border-radius: 12px; background: #fff; text-align: center; cursor: pointer; scroll-snap-align: start; color: var(--tinta); }
  .day .wd { font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--sivo); }
  .day .dn { font: 700 24px var(--display); line-height: 1.15; }
  .day .mo { font-size: 12px; color: var(--sivo); }
  .day.sel { background: var(--skura); border-color: var(--skura); color: #fff; }
  .day.sel .wd, .day.sel .mo { color: rgba(255, 255, 255, .85); }
  .day:disabled { cursor: default; background: transparent; border-style: dashed; color: var(--sivo); }
  .day:disabled .dn { text-decoration: line-through; text-decoration-thickness: 1px; }
  .day.other { display: grid; place-items: center; font: 600 13px var(--body); color: var(--skura); }
  .datepick { margin-top: 8px; }

  .zones { display: flex; flex-wrap: wrap; gap: 8px; }
  .zones button { border: 1px solid var(--crta); background: #fff; border-radius: 999px; padding: 8px 14px; font: 600 14px var(--body); cursor: pointer; color: var(--tinta); }
  .zones button.sel { background: var(--skura); border-color: var(--skura); color: #fff; }

  .part { margin-top: 4px; }
  .part + .part { margin-top: 14px; }
  .part h3 { font: 700 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--sivo); margin: 0 0 8px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
  .slot { padding: 11px 4px; border: 1px solid var(--crta); border-radius: 10px; background: #fff; font: 700 17px var(--mono); cursor: pointer; color: var(--tinta); }
  .slot:hover { border-color: var(--skura); }
  .slot.sel { background: var(--skura); border-color: var(--skura); color: #fff; }
  .slot.skel { height: 46px; border-color: transparent; background: linear-gradient(90deg, var(--crta-2), #f4f5f1, var(--crta-2)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .none { padding: 14px; border-radius: 10px; background: var(--kamen); color: var(--sivo); font-size: 15px; }
  .none .btn { margin-top: 10px; }

  form.details { display: grid; gap: 12px; }
  .hp { position: absolute; left: -9999px; }
  .ginfo { padding: 10px 12px; border-radius: 10px; background: var(--ulje-svj); color: var(--ulje-tamno); font-size: 14px; }
  .msg { padding: 11px 13px; border-radius: 10px; font-size: 15px; font-weight: 600; }
  .msg.err { background: var(--crveno-svj); color: var(--crveno); }
  .msg.ok { background: var(--zeleno-svj); color: var(--skura); }
  .msg .alts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .msg .alts button { border: 1px solid currentColor; background: #fff; border-radius: 8px; padding: 6px 10px; font: 700 14px var(--mono); color: var(--crveno); cursor: pointer; }
  .privacy { font-size: 13px; color: var(--sivo); margin: 0; }
  .submit-sum { display: block; font: 500 13px var(--body); opacity: .85; margin-top: 2px; }

  /* listić rezervacije */
  .ticket { background: var(--vapno); border-radius: 16px; box-shadow: var(--sjena); overflow: hidden; border: 1px solid var(--crta); }
  .t-top { padding: 22px 20px 18px; }
  .t-top .rn { font: 700 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--sivo); }
  .t-top h2 { font-size: 34px; margin: 6px 0 4px; }
  .t-top p { margin: 0; color: var(--sivo); }
  .t-facts { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 10px; margin-top: 18px; }
  .t-facts span { display: block; font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--sivo); }
  .t-facts b { font: 700 20px var(--display); }
  .t-facts .tm { font: 700 22px var(--mono); }
  .perf { position: relative; height: 0; border-top: 2px dashed var(--crta); margin: 0 18px; }
  .perf::before, .perf::after { content: ''; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--kamen); border: 1px solid var(--crta); }
  .perf::before { left: -30px; } .perf::after { right: -30px; }
  .t-stub { padding: 16px 20px 20px; display: grid; gap: 12px; }
  .t-stub .code { font: 700 30px var(--mono); letter-spacing: .22em; }
  .t-stub .lab { font: 700 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--sivo); }
  .t-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .t-status { display: inline-block; margin-top: 8px; }

  /* donja ploča: meni i radno vrijeme */
  .sheet-bg { position: fixed; inset: 0; background: rgba(20, 30, 27, .4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  .sheet-bg.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; width: min(560px, 100%); max-height: 86vh; transform: translate(-50%, 102%); transition: transform .25s ease;
    background: var(--vapno); border-radius: 18px 18px 0 0; z-index: 31; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0, 0, 0, .2);
    visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s; }
  .sheet.on { transform: translate(-50%, 0); visibility: visible; transition: transform .25s ease; }
  .sheet-h { display: flex; align-items: center; padding: 16px 18px 10px; border-bottom: 1px solid var(--crta); }
  .sheet-h h2 { font-size: 22px; flex: 1; }
  .sheet-b { overflow: auto; padding: 8px 18px 24px; }
  .mcat { font: 700 12px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--sivo); margin: 18px 0 6px; }
  .mitem { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--crta-2); }
  .mitem div { flex: 1; } .mitem b { font-weight: 700; }
  .mitem .d { font-size: 14px; color: var(--sivo); }
  .mitem .a { font-size: 12px; color: var(--ulje-tamno); margin-top: 2px; }
  .mitem .p { font: 700 15px var(--mono); white-space: nowrap; }
  .hours { width: 100%; border-collapse: collapse; }
  .hours td { padding: 9px 0; border-bottom: 1px solid var(--crta-2); }
  .hours td:last-child { text-align: right; font-family: var(--mono); }
  .hours tr.today td { font-weight: 700; }
  footer.pw { text-align: center; font-size: 12px; color: var(--sivo); padding: 0 16px 24px; }
  footer.pw a { color: var(--sivo); }
</style>
</head>
<body>
<div class="wrap">
  <header class="band">
    <div class="langs" role="group" aria-label="Jezik / Language"><button data-l="hr">HR</button><button data-l="en">EN</button><button data-l="de">DE</button></div>
    <h1 id="rname">&nbsp;</h1>
    <div class="addr" id="raddr"></div>
    <div class="hrow">
      <button class="hbtn" id="hoursBtn" type="button"><span class="dot" id="openDot"></span><span id="openTxt"></span></button>
      <button class="hbtn hidden" id="menuBtn" type="button" data-t="menu"></button>
      <a class="hbtn hidden" id="telBtn"></a>
    </div>
  </header>

  <main>
    <div id="topMsg"></div>

    <!-- odabir: osobe, dan, zona, vrijeme -->
    <div id="pick">
      <section class="sec" style="margin-bottom:14px">
        <h2 data-t="howMany"></h2>
        <div class="stepper"><button type="button" id="pMinus" aria-label="−">−</button><output id="party" aria-live="polite">2</output>
          <button type="button" id="pPlus" aria-label="+">+</button><span class="lbl" id="pLbl"></span></div>
        <div class="bignote hidden" id="bigNote"></div>
      </section>
      <section class="sec" style="margin-bottom:14px">
        <h2 data-t="when"></h2>
        <div class="days" id="days"></div>
        <input type="date" class="in datepick hidden" id="dateIn">
      </section>
      <section class="sec hidden" id="zoneSec" style="margin-bottom:14px">
        <h2 data-t="where"></h2>
        <div class="zones" id="zones"></div>
      </section>
      <section class="sec" id="slotSec">
        <h2><span data-t="time"></span> <small id="slotDay"></small></h2>
        <div id="slots"></div>
      </section>
    </div>

    <!-- podaci gosta -->
    <section class="sec hidden" id="details">
      <h2 data-t="yourDetails"></h2>
      <form class="details" id="bookForm" novalidate>
        <label class="field"><span data-t="name"></span><input id="name" autocomplete="name" required></label>
        <label class="field"><span><span data-t="phone"></span> <span class="hint" data-t="phoneHint"></span></span><input id="phone" type="tel" autocomplete="tel" placeholder="+385 91 …"></label>
        <label class="field"><span><span data-t="email"></span> <span class="hint" data-t="emailHint"></span></span><input id="email" type="email" autocomplete="email"></label>
        <label class="field"><span data-t="notes"></span><textarea id="notes" rows="2" maxlength="500"></textarea></label>
        <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="ginfo hidden" id="guaranteeInfo"></div>
        <div id="bookMsg" role="alert"></div>
        <button class="btn btn-p btn-lg btn-block" id="submit"><span><span data-t="book"></span><span class="submit-sum" id="submitSum"></span></span></button>
        <p class="privacy" data-t="privacy"></p>
      </form>
    </section>

    <!-- potvrda -->
    <section id="done" class="hidden"></section>

    <!-- pregled, izmjena, otkaz -->
    <section id="manage" class="hidden">
      <div class="sec" id="mAsk">
        <h2><span data-t="reservation"></span> <span class="mono" id="mCodeAsk"></span></h2>
        <form class="details" id="mForm">
          <label class="field"><span data-t="contactCheck"></span><input id="mContact" autocomplete="tel" required></label>
          <div id="mAskMsg" role="alert"></div>
          <button class="btn btn-p btn-lg btn-block" data-t="show"></button>
        </form>
      </div>
      <div id="mView"></div>
    </section>
  </main>
  <footer class="pw">Opsis Restoran</footer>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="btn btn-ghost btn-s" id="sheetClose" aria-label="✕">✕</button></div>
  <div class="sheet-b" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/book.js"></script>
</body>
</html>
