<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4d43">
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>Meni</title>
<link rel="stylesheet" href="/static/opsis.css">
<style>
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 640px; margin: 0 auto; }
  header.band { background: var(--lamele); color: #fff; padding: 12px 18px 16px; }
  .langs { display: flex; justify-content: flex-end; gap: 2px; }
  .langs button { border: 0; background: none; color: rgba(255, 255, 255, .75); font: 700 13px var(--body); padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .langs button.on { color: #fff; background: rgba(255, 255, 255, .14); }
  header h1 { font-size: 28px; }
  .tbl { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(255, 255, 255, .12); font-weight: 600; }
  .tbl b { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; background: var(--ulje); color: var(--tinta); font: 700 15px var(--mono); }

  nav.cats { position: sticky; top: 0; z-index: 5; background: var(--kamen); border-bottom: 1px solid var(--crta); }
  .cats-in { display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px; scrollbar-width: none; }
  .cats-in::-webkit-scrollbar { display: none; }
  .cats-in button { flex: none; border: 1px solid var(--crta); background: var(--vapno); border-radius: 999px; padding: 7px 14px; font: 600 14px var(--body); color: var(--tinta); cursor: pointer; }
  .cats-in button.on { background: var(--tinta); border-color: var(--tinta); color: #fff; }
  .filter { display: flex; align-items: center; gap: 8px; padding: 0 14px 10px; font-size: 13px; color: var(--sivo); flex-wrap: wrap; }
  .filter .btn { min-height: 30px; }

  .cat h2 { font-size: 22px; padding: 22px 16px 8px; scroll-margin-top: 110px; }
  .item { display: flex; gap: 12px; align-items: flex-start; margin: 0 12px 8px; padding: 14px; background: var(--vapno); border: 1px solid var(--crta); border-radius: 14px; }
  .item.in { border-color: var(--skura); box-shadow: inset 4px 0 0 var(--skura); }
  .item .info { flex: 1; min-width: 0; }
  .item .nm { font-weight: 700; font-size: 17px; }
  .item .ds { color: var(--sivo); font-size: 14px; margin-top: 2px; }
  .item .al { font-size: 12px; color: var(--ulje-tamno); margin-top: 6px; }
  .item .pr { font: 700 16px var(--mono); margin-top: 8px; }
  .qty { display: flex; align-items: center; gap: 4px; flex: none; }
  .qty button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--crta); background: #fff; font: 600 22px/1 var(--body); color: var(--skura); cursor: pointer; }
  .qty .add { background: var(--skura); border-color: var(--skura); color: #fff; }
  .qty output { min-width: 26px; text-align: center; font: 700 17px var(--mono); }
  .hiddenNote { margin: 6px 16px 0; font-size: 13px; color: var(--sivo); }
  .allergyNote { margin: 22px 16px 0; font-size: 13px; color: var(--sivo); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--vapno); border-top: 1px solid var(--crta);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .bar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
  .bar .btn { flex: 1; min-height: 52px; border-radius: 12px; font-size: 15px; }
  .bar .cartb { flex: 1.8; justify-content: space-between; }
  .bar .cartb .n { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 13px; background: var(--ulje); color: var(--tinta); font: 700 13px var(--mono); padding: 0 7px; }
  .bar .sent { background: var(--zeleno-svj); border-color: var(--zeleno-svj); color: var(--skura); }

  .sheet-bg { position: fixed; inset: 0; background: rgba(20, 30, 27, .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  .sheet-bg.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; width: min(640px, 100%); max-height: 88vh; transform: translate(-50%, 102%); transition: transform .25s ease;
    background: var(--vapno); border-radius: 18px 18px 0 0; z-index: 31; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0, 0, 0, .2);
    visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s; }
  .sheet.on { transform: translate(-50%, 0); visibility: visible; transition: transform .25s ease; }
  .sheet-h { display: flex; align-items: center; padding: 16px 18px 10px; border-bottom: 1px solid var(--crta); }
  .sheet-h h2 { font-size: 22px; flex: 1; }
  .sheet-b { overflow: auto; padding: 10px 18px 18px; display: grid; gap: 12px; }
  .sheet-f { padding: 12px 18px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--crta); display: grid; gap: 10px; }
  .line { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--crta-2); }
  .line .nm { flex: 1; font-weight: 600; }
  .line .p { font: 600 14px var(--mono); min-width: 74px; text-align: right; }
  .total { display: flex; justify-content: space-between; font: 700 18px var(--display); }
  .total b { font-family: var(--mono); }
  .algs { display: flex; flex-wrap: wrap; gap: 8px; }
  .algs label { cursor: pointer; }
  .algs input { position: absolute; opacity: 0; }
  .algs span { display: inline-block; padding: 8px 12px; border: 1px solid var(--crta); border-radius: 999px; background: #fff; font-weight: 600; font-size: 14px; }
  .algs input:checked + span { background: var(--crveno-svj); border-color: var(--crveno); color: var(--crveno); text-decoration: line-through; }
  .algs input:focus-visible + span { outline: 3px solid var(--ulje); outline-offset: 2px; }
  .hist { font-size: 14px; }
  .hist div { padding: 6px 0; border-bottom: 1px solid var(--crta-2); }
  .hist .tm { font-family: var(--mono); color: var(--sivo); margin-right: 6px; }
  .ok-big { text-align: center; padding: 10px 0 4px; }
  .ok-big .tick { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%; background: var(--skura); color: #fff; display: grid; place-items: center; font-size: 34px; }
  .ok-big h3 { font-size: 24px; }
  .ok-big p { color: var(--sivo); margin: 6px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="band">
    <div class="langs" role="group" aria-label="Jezik / Language"><button data-l="hr">HR</button><button data-l="en">EN</button><button data-l="de">DE</button></div>
    <h1 id="rname">&nbsp;</h1>
    <div class="tbl"><b id="tno">·</b><span id="tlab"></span></div>
  </header>
  <nav class="cats" aria-label="Kategorije">
    <div class="cats-in" id="cats"></div>
    <div class="filter"><button class="btn btn-s" id="algBtn"></button><span id="algNow"></span></div>
  </nav>
  <div id="menu"></div>
  <p class="allergyNote" id="allergyNote"></p>
</div>

<div class="bar"><div class="bar-in">
  <button class="btn" id="waiter"></button>
  <button class="btn" id="bill"></button>
  <button class="btn btn-p cartb" id="cartBtn"><span id="cartTxt"></span><span class="n" id="cartN">0</span></button>
</div></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="btn btn-ghost btn-s" id="sheetClose" aria-label="✕">✕</button></div>
  <div class="sheet-b" id="sheetBody"></div>
  <div class="sheet-f" id="sheetFoot"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/menu.js"></script>
</body>
</html>
