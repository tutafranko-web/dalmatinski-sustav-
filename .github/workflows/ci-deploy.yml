# Testovi na svaki push; na granu main nakon uspješnih testova automatski deploy na VPS.
# Deploy se uključi kad u GitHub → Settings → Secrets and variables → Actions dodaš:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (privatni ključ), VPS_PATH (npr. /opt/opsis-restoran)
name: CI i deploy

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: Preskoči ako VPS nije podešen
        if: env.HAS_VPS != 'true'
        run: echo "VPS_HOST nije postavljen — deploy preskočen."
      - name: Deploy na VPS
        if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            git fetch --depth 1 origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            sleep 8
            curl -fsS http://127.0.0.1:3000/health
